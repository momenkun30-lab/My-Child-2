<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>توقع شكل طفلك - ذكاء اصطناعي احترافي</title>
    <meta name="description" content="استخدم أقوى تقنيات الذكاء الاصطناعي لتوقع شكل طفلك المستقبلي بناءً على صور الوالدين" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --font-arabic: 'Cairo', sans-serif;
        --font-english: 'Inter', sans-serif;
      }
      
      body {
        margin: 0;
        padding: 0;
        background-color: #030712;
        font-family: var(--font-arabic);
        color: white;
        overflow-x: hidden;
      }

      html[dir="ltr"] body {
        font-family: var(--font-english);
      }
      
      html[dir="rtl"] body {
        font-family: var(--font-arabic);
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #030712;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
